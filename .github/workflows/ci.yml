name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sales_automation_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_automation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sales_automation_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Migration smoke test
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sales_automation_migration_test
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("DROP DATABASE IF EXISTS sales_automation_migration_test WITH (FORCE)")
              conn.execute("CREATE DATABASE sales_automation_migration_test")
          PY
          DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" python scripts/migrate.py
          DATABASE_URL="$MIGRATION_TEST_DATABASE_URL" python scripts/migrate.py
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["MIGRATION_TEST_DATABASE_URL"]) as conn:
              rows = conn.execute(
                  "SELECT version FROM schema_migrations ORDER BY version"
              ).fetchall()
          assert len(rows) == 5, f"Expected 5 migrations, found {len(rows)}: {rows}"
          print(f"Migration smoke test passed: {len(rows)} migrations recorded after rerun.")
          PY
      - name: Build Docker image
        run: docker build --tag ai-sales-customer-automation:ci .
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
